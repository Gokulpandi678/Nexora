# Local development stack.
#   docker compose up -d db          → Postgres only (run the app with `npm run dev`)
#   docker compose up --build        → Postgres + production build of the app on :3000
services:
  db:
    image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (semantic matching)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/incident_tracker
      DIRECT_URL: postgresql://postgres:postgres@db:5432/incident_tracker
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
